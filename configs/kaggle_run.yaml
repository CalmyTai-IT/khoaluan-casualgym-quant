# configs/kaggle_run.yaml — "chạy gì" cho lần Save Version tiếp theo.
# Quy trình: sửa file này -> commit -> push -> Kaggle runner -> Save Version -> Save & Run All.
# Mỗi job chạy một notebook trong notebooks/ bằng papermill; "params" ghi đè ô parameters của notebook.
# OUT_DIR và REPO_DIR do runner tự đặt, không ghi ở đây.
#
# Bản 12/11/2026 (lần 2): chạy G0b bằng notebooks/00_g0_pilot.ipynb bản 2.
# Notebook bản 2 không nhận tham số bản 1 (BITS, ALPHAS, ALPHA_BITS, RELEARN_BITS, SPLIT_BITS): job sẽ dừng với ValueError.
# Cấu hình G0 cũ nằm ở commit 1232ff0 nếu cần xem lại.

run_name: g0b               # thư mục kết quả là outputs/<ngày giờ>_g0b
stop_on_error: true         # smoke lỗi thì bỏ job full, đỡ tốn quota
pip: []                     # gói cài thêm nếu cần, ví dụ ["datasets>=3"]

jobs:
  # 1) Smoke: chạy mọi đường ống của bản 2 nhưng rất nhỏ (khoảng 2-3 phút). Chỉ để bắt lỗi code trước job full.
  - name: g0b_smoke_410m
    enabled: true
    notebook: notebooks/00_g0_pilot.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASK: agr_sv_num_subj-relc
      MAX_TRAIN: 40
      MAX_EVAL: 32
      LAYERS: [6, 12, 17]
      REGIONS: "all"
      QCONFIGS: [[4, 1.0], [2, 0.5]]
      RELEARN_CONFIGS: [[4, 1.0]]
      SPLIT_CONFIGS: [[4, 1.0]]
      SEEDS: 2
      N_BOOT: 200
      SKIP_STEP0: true

  # 2) G0b đầy đủ trên 410M: bản đồ mọi layer x mọi vùng, ô chính theo D-08, lưới nén quanh vùng chuyển tiếp 4 -> 3 -> 2 bit.
  - name: g0b_full_410m
    enabled: true
    notebook: notebooks/00_g0_pilot.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASK: agr_sv_num_subj-relc
      LAYERS: "all"
      REGIONS: "all"
      MAIN_RULE: "last_early"
      MAIN_FRAC: 0.8
      QCONFIGS: [[8, 1.0], [4, 1.0], [3, 0.5], [3, 0.75], [3, 1.0], [2, 0.25], [2, 0.5], [2, 0.75], [2, 1.0]]
      RELEARN_CONFIGS: [[4, 1.0], [3, 1.0], [2, 0.5]]
      SPLIT_CONFIGS: [[4, 1.0], [3, 1.0]]
      SEEDS: 5
      SKIP_STEP0: false
