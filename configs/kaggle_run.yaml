# configs/kaggle_run.yaml — "chạy gì" cho lần Save Version tiếp theo.
# Quy trình: sửa file này -> commit -> push -> Kaggle runner -> Save Version -> Save & Run All.
# Mỗi job chạy một notebook trong notebooks/ bằng papermill; "params" ghi đè ô parameters của notebook.
# OUT_DIR và REPO_DIR do runner tự đặt, không ghi ở đây.
#
# Bản 16/11/2026 (lần 2): KHÔNG CÓ JOB NÀO BẬT.
# G1r đã chạy xong (run 20261116_0515_g1r, commit 243e926). Ba job dưới đây giữ nguyên nội dung nhưng tắt (enabled: false),
# để lỡ bấm Save Version trên runner thì không chạy lại G1r (khoảng 1,5 giờ GPU).
# Việc GPU kế tiếp (notebook 97) chạy từng ô, không qua runner (VIEC_CAN_LAM.md).
# Job C1 sẽ được thêm khi có SPEC C1 và notebook 02.

run_name: none              # thư mục kết quả là outputs/<ngày giờ>_none nếu runner vẫn được chạy
stop_on_error: true
pip: []

jobs:
  - name: g1r_smoke_410m
    enabled: false
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      MAX_TRAIN: 40
      MAX_EVAL: 20
      LAYERS: [6, 23]
      SAVE_DIRS: false
      MAX_HOURS: 0.5

  - name: g1r_410m
    enabled: false
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      SAVE_DIRS: false
      MAX_HOURS: 1.5

  - name: g1r_1b
    enabled: false
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-1b
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      SAVE_DIRS: false
      MAX_HOURS: 2.0
