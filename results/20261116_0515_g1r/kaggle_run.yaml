# configs/kaggle_run.yaml — "chạy gì" cho lần Save Version tiếp theo.
# Quy trình: sửa file này -> commit -> push -> Kaggle runner -> Save Version -> Save & Run All.
# Mỗi job chạy một notebook trong notebooks/ bằng papermill; "params" ghi đè ô parameters của notebook.
# OUT_DIR và REPO_DIR do runner tự đặt, không ghi ở đây.
#
# Bản 16/11/2026: G1r — chạy lại G1 ở POS_MODE "repo" (tái hiện lỗi vị trí của repo gốc, sổ §8 điểm 9)
# chỉ cho 2 tác vụ có cặp lệch vị trí: agr_sv_num_subj-relc (16%) và cleft (8%).
# Mục đích: kiểm giả thuyết lệch so với bài gốc ở mean/PCA/k-means là do lỗi vị trí. Quy tắc D-16 đặt trước khi chạy (sổ §3).
# Mọi thứ khác giống hệt G1 (commit d755410, run 20261113_0846_g1): split test, fp32, 9 phương pháp, dog-give, seed 0.
# Ước thời gian [suy từ phút từng tác vụ của G1]: smoke khoảng 2 phút; 410m khoảng 40 phút; 1b khoảng 45 phút; tổng khoảng 1,5 giờ.
# Cấu hình G1 (POS_MODE correct, 4 tác vụ) nằm ở commit d755410 nếu cần xem lại.

run_name: g1r               # thư mục kết quả là outputs/<ngày giờ>_g1r
stop_on_error: true         # smoke lỗi thì bỏ các job sau
pip: []

jobs:
  # 1) Smoke: 2 tác vụ, dữ liệu rất nhỏ, 2 layer, POS_MODE repo.
  - name: g1r_smoke_410m
    enabled: true
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      MAX_TRAIN: 40
      MAX_EVAL: 20
      LAYERS: [6, 23]
      SAVE_DIRS: false
      MAX_HOURS: 0.5

  # 2) 410m đầy đủ ở POS_MODE repo (mọi layer x mọi vùng, 9 phương pháp, dog-give).
  - name: g1r_410m
    enabled: true
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-410m
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      SAVE_DIRS: false
      MAX_HOURS: 1.5

  # 3) 1b đầy đủ ở POS_MODE repo (fp32; bài gốc chạy 1b ở bfloat16).
  - name: g1r_1b
    enabled: true
    notebook: notebooks/01_tai_lap_causalgym.ipynb
    params:
      MODEL: EleutherAI/pythia-1b
      TASKS: ["agr_sv_num_subj-relc", "cleft"]
      POS_MODE: "repo"
      SAVE_DIRS: false
      MAX_HOURS: 2.0
